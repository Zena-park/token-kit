# Two ecosystems, one cadence. Every PR these open still has to clear the
# full CI gate (tests, storage-slot pinning, Slither, Halmos) before merge.
#
# Submodules are not tracked: Dependabot follows a branch head, not a release
# tag, and the two OpenZeppelin libraries must move together onto one tagged
# release. The two OpenZeppelin npm packages in package.json are an advisory
# canary for the submodules -- see CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # The OpenZeppelin packages are a canary: security advisories should
    # reach us, ordinary releases should not open PRs -- moving to one is a
    # submodule upgrade, made by hand. `ignore` only silences version
    # updates; Dependabot security updates are unaffected by it.
    ignore:
      - dependency-name: "@openzeppelin/*"
