# Two ecosystems, one cadence. Every PR these open still has to clear the
# full CI gate (tests, storage-slot pinning, Slither, Halmos) before merge.
#
# Submodules are not tracked: Dependabot follows a branch head, not a release
# tag, and the two OpenZeppelin libraries must move together onto one tagged
# release. See CONTRIBUTING.md for how they are updated.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
